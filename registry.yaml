# registry.yaml —— AiPalace skill 管理单一事实源
# skill-management 方法论（来源→分类→skill + tier 控 token）
# sync 落地形态 = 软链（symlink），派生回仓库真身（ADR-0005：实测软链 skill 在 / 斜杠菜单
# 正常可见，#14836 仅影响 /skills 管理命令列表，不影响自动触发与 / 菜单）。
# 受管判定靠软链指向（is_managed），兼容旧 .aipalace-managed 标记；doctor --fix 清悬挂。
#
# 物理结构：
#   skills/mine/<skill>/                       自建
#   skills/enterprise/<公司>/<skill>/          公司内部
#   skills/community/<来源>/<...>/<skill>/      第三方（garveyhu 三级保真 / github-skills 按性质分）
# 改完此表后跑：python3 tools/skillctl.py sync  再 doctor 验收
# ⚠️ 仍只在本地编排，sync 会把 core+extra 软链派生进 ~/.claude/skills 与 ~/.codex/skills。

# flat_mirror: ~/.agents/skills   # 扁平镜像：仅 core 拍平软链（不含 core 层），供支持默认加载层的
#                                 # agent runtime 使用。本轮机制就绪，暂不强制启用，取消注释即激活。

# ───────────────────────────────────────────────────────────
# 1) 挂载点
mounts:
  - ~/.claude/skills          # Claude Code：原生 skill 自动发现
  - ~/.codex/skills           # Codex：自 2025-12 起原生支持 skill 自动发现

# 2) 来源：按「谁创建的」分
sources:
  mine:             "我自己原创的 skill · 源码 SOT"
  zhijin:           "enterprise · 公司（智金）内部 skill"
  garveyhu:         "community · 同事 garveyhu 自创开源上游（三级保真，整份备份+最新版）"
  github-skills:    "community · 从各开源项目节选的好用 skill（按来源性质分子目录）"
  superpowers:      "community · obra/superpowers 上游（Jesse Vincent，MIT）——插件卸载后个别挑取仍被 mine skill 依赖的单项（ADR-0018）"

# 3) 分类
categories:
  workflow: "工作流编排 · 端到端 SOP"
  method:   "研发方法论 · 计划/调试/评审/research/grill"
  sql:      "数据库 · 评审/优化/DDL/查数/双库"
  stack:    "技术栈实践 · 各框架最佳实践"
  docs:     "写作与文档"
  design:   "设计与视觉"
  diagram:  "图表生成"
  media:    "图像与视频生成"
  meta:     "skill 管理 · 自改进 · 安全审计"

# 4) 项目声明（project tier skill 的归属项目须在此段声明）
projects:                                       # project skill 挂至各 git 根 .claude/skills + .agents/skills（ADR-0015）
  zhijin:     ~/Library/IdeaProject/ZhiJin       # 智金 ZhiJin（SunkidCloud/SaaS/托育等，公司伞级，非仅 SaaS）
  zhijin_etl: ~/Library/IdeaProject/WaveFlow     # 智金 ETL 业务（WaveFlow）

# 5) skill 登记：source / category / tier / [project]
#    tier:
#      core    → 进全局挂载（core+extra 均进）；优先加载；/ 菜单可见
#      extra   → 进全局挂载；按需加载；/ 菜单可见
#      project → 移出全局；opt-in mount 至指定项目双发现目录（.claude/skills + .agents/skills）；须声明 project: 字段
#                （一个 skill 可属多项目，逗号分隔无空格：project: zhijin,zhijin_etl；ADR-0017）
#      parked  → 仅仓库备份，不挂载，不占 token 预算
skills:
  # ---- mine（原创） ----
  ownerpowers:                        {source: mine, category: workflow, tier: project, project: zhijin,zhijin_etl}
  biz-workflow:                       {source: mine, category: workflow, tier: parked}   # 已被 ownerpowers 完全取代，验证期结束下线（ADR-0019），仓内留档
  spec-architect:                     {source: mine, category: docs,     tier: project, project: zhijin,zhijin_etl}
  commit-review:                      {source: mine, category: method,   tier: project, project: zhijin,zhijin_etl}
  git-merge-conductor:                {source: mine, category: method,   tier: core}

  # ---- community / superpowers（插件卸载后个别挑取，ADR-0018） ----
  superpowers/using-git-worktrees:    {source: superpowers, category: workflow, tier: project, project: zhijin,zhijin_etl}  # git-merge-conductor Stage 3 依赖
  superpowers/writing-plans:          {source: superpowers, category: method,   tier: project, project: zhijin,zhijin_etl}  # spec-architect complex 分支推荐

  # ---- enterprise / zhijin（公司内部） ----
  zhijin/liquibase-dual-db-writer:    {source: zhijin, category: sql,    tier: project, project: zhijin}

  # ---- community / github-skills（开源节选） ----
  # mattpocock 族（整族同源、互相依赖，同步须整族一起做，依赖图见 mattpocock/_SOURCE.md）
  mattpocock/grilling:                {source: github-skills, category: method, tier: extra}   # 全族的地基：一次一问的拷问
  mattpocock/grill-me:                {source: github-skills, category: method, tier: extra}   # → grilling
  mattpocock/grill-with-docs:         {source: github-skills, category: method, tier: extra}   # → grilling + domain-modeling
  mattpocock/domain-modeling:         {source: github-skills, category: method, tier: extra}   # grill-with-docs 的硬依赖，卸了它 grill-with-docs 即断链
  mattpocock/teach:                   {source: github-skills, category: workflow, tier: extra}  # 独立无依赖：跨会话教学工作区(lessons/学习记录/mission)
  # 以下四项 parked（ADR-0025）：wayfinder 不接公司 GitLab，其设计已吸收进 ownerpowers T3；
  # research/prototype 在 T3 里只是条目类型名、非 skill 调用；setup 只为配 tracker 而存在。
  mattpocock/wayfinder:               {source: github-skills, category: workflow, tier: parked}
  mattpocock/research:                {source: github-skills, category: method, tier: parked}
  mattpocock/prototype:               {source: github-skills, category: method, tier: parked}
  mattpocock/setup-matt-pocock-skills: {source: github-skills, category: meta,  tier: parked}

  anthropic-official/docx:            {source: github-skills, category: docs,   tier: extra}
  third-party/skill-security-audit:   {source: github-skills, category: meta,   tier: extra}
  misc/find-skills:                   {source: github-skills, category: meta,   tier: extra}
  third-party/humanizer:              {source: github-skills, category: docs,   tier: extra}   # blader/humanizer 去英文AI味
  third-party/humanizer-zh:           {source: github-skills, category: docs,   tier: extra}   # op7418 汉化版 去中文AI味

  # ---- community / garveyhu（上游备份，已逐项挑删，非完整镜像，详见 _SOURCE.md） ----
  garveyhu/html-diagram:              {source: garveyhu, category: diagram, tier: extra}
  garveyhu/docsify-station-creator:   {source: garveyhu, category: docs,    tier: parked}
  garveyhu/notion-chat-archiver:      {source: garveyhu, category: docs,    tier: parked}
  garveyhu/solution-vault:            {source: garveyhu, category: docs,    tier: parked}
  garveyhu/spechub-best-practices:    {source: garveyhu, category: docs,    tier: parked}
  garveyhu/wiki-creator:              {source: garveyhu, category: docs,    tier: parked}
  garveyhu/browser-gen:               {source: garveyhu, category: media,   tier: parked}
  garveyhu/codex-image-gen:           {source: garveyhu, category: media,   tier: extra}
  garveyhu/comfyui:                   {source: garveyhu, category: media,   tier: parked}
  garveyhu/self-improving-workflow:   {source: garveyhu, category: meta,    tier: parked}
  garveyhu/skill-management:          {source: garveyhu, category: meta,    tier: extra}
  garveyhu/deep-research:             {source: garveyhu, category: method,  tier: extra}
  garveyhu/docker-best-practices:     {source: garveyhu, category: stack,   tier: extra}
  garveyhu/fastapi-best-practices:    {source: garveyhu, category: stack,   tier: parked}
  garveyhu/website-creator:           {source: garveyhu, category: stack,   tier: parked}
